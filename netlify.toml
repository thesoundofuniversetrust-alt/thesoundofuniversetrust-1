# =============================================================================
#  The Sound of Universe Trust — Netlify configuration
# =============================================================================

[build]
  # The folder to deploy (your website lives in tsu-website/)
  publish = "tsu-website"
  functions = "netlify/functions"

# Redirect /api/* to Netlify Functions
[[redirects]]
  from = "/api/auth"
  to   = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/verify-otp"
  to   = "/.netlify/functions/verify-otp"
  status = 200

[[redirects]]
  from = "/api/content"
  to   = "/.netlify/functions/content"
  status = 200

[[redirects]]
  from = "/api/cloudinary-sign"
  to   = "/.netlify/functions/cloudinary-sign"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Block direct access to admin — only accessible from the site itself
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[functions]
  node_bundler = "esbuild"
